[project]
name = "a11y-loop"
version = "0.1.0"
description = "Agentic accessibility audit-and-fix loop for SwiftUI apps: find violations on the running app, patch safe classes in source, prove fixes by re-audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
a11y-loop = "a11y_loop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
