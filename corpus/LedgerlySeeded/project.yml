name: Ledgerly
options:
  bundleIdPrefix: dev.a11yloop
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  Ledgerly:
    type: application
    platform: iOS
    sources: [Ledgerly]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.a11yloop.ledgerly
  LedgerlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LedgerlyUITests]
    dependencies:
      - target: Ledgerly
schemes:
  Ledgerly:
    build:
      targets:
        Ledgerly: all
        LedgerlyUITests: [test]
    test:
      targets:
        - LedgerlyUITests
